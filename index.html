<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1033">
<title>Para Karito 💛</title>
<meta name="description" content="Una tarjeta de cumpleaños de Nata y Tati para Karito.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%9B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="fx"></canvas>
  <div id="fxdom"></div>

  <!-- ============ INTRO ============ -->
  <section id="intro" class="screen active">
    <div class="sky">
      <div class="sun"></div>
      <div class="stars"></div>
    </div>
    <svg class="bunting" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-5 8 Q200 62 405 8" fill="none" stroke="#f5e2a1" stroke-width="2"/>
    </svg>
    <div class="bunting-flags" id="flags"></div>
    <div class="balloons" id="balloons"></div>

    <div class="sound-hint" id="soundHint">🎵 Toca la pantalla para activar música y voz</div>
    <div class="intro-stage" id="introStage">
      <div class="bubble" id="bubble"><span id="bubbleText"></span><i class="tail"></i></div>
      <div class="duo">
        <div class="who who-nata" id="whoNata"><div class="sprite" id="spriteNata"></div><b>Nata</b></div>
        <div class="who who-tati" id="whoTati"><div class="sprite" id="spriteTati"></div><b>Tati</b></div>
      </div>
      <div class="intro-hint" id="introHint">👆 Toca a Nata y Tati</div>
      <button class="btn-gold open-book" id="openBook" hidden>Abrir nuestro libro&nbsp;📖</button>
    </div>
    <svg class="waves" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="w1" d="M0 50 Q50 20 100 50 T200 50 T300 50 T400 50 V120 H0Z"/>
      <path class="w2" d="M0 70 Q50 40 100 70 T200 70 T300 70 T400 70 V120 H0Z"/>
    </svg>
  </section>

  <!-- ============ LIBRO ============ -->
  <section id="bookScreen" class="screen">
    <div class="hud">
      <button id="btnSound" class="chip" aria-label="Música">♪</button>
      <div id="progress"><i></i></div>
      <div id="treasureCount" class="chip">🔍 <b>0</b>/10</div>
    </div>
    <div class="book" id="book"></div>
    <nav class="nav">
      <button id="prev" aria-label="Página anterior">‹</button>
      <div class="pageno" id="pageno"></div>
      <button id="next" aria-label="Página siguiente">›</button>
    </nav>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>
</div>

<script src="js/fx.js"></script>
<script src="js/music.js"></script>
<script src="js/voice.js"></script>
<script src="js/characters.js"></script>
<script src="js/scenes.js"></script>
<script src="js/gift.js"></script>
<script src="js/app.js"></script>
</body>
</html>
